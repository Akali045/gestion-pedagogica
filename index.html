<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Pedagógica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fafaf9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f4;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #78716c;
            --accent: #0c4a6e;
            --accent-hover: #075985;
            --accent-light: #e0f2fe;
            --border: #e7e5e4;
            --shadow: rgba(0, 0, 0, 0.08);
            --danger: #b91c1c;
            --danger-hover: #991b1b;
            --success: #15803d;
            --warning: #ca8a04;
        }

        [data-theme="dark"] {
            --bg-primary: #1c1917;
            --bg-secondary: #292524;
            --bg-tertiary: #44403c;
            --text-primary: #fafaf9;
            --text-secondary: #d6d3d1;
            --text-tertiary: #a8a29e;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-light: #0c4a6e;
            --border: #44403c;
            --shadow: rgba(0, 0, 0, 0.3);
            --danger: #f87171;
            --danger-hover: #fca5a5;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3 {
            font-family: 'Crimson Pro', serif;
            font-weight: 700;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-tertiary) 100%);
        }

        .login-container {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px var(--shadow);
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 0.5s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        .form-group input[type="color"] {
            width: 100px;
            padding: 0.25rem;
            height: 45px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-left: 4px solid var(--danger);
        }

        [data-theme="dark"] .error-message {
            background: #7f1d1d;
            color: #fecaca;
        }

        /* Main App */
        .app-container {
            display: none;
        }

        .app-container.active {
            display: block;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border);
            padding: 1.25rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .view-groups, .view-group-detail, .view-student-detail {
            display: none;
        }

        .view-groups.active, .view-group-detail.active, .view-student-detail.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 2rem;
            color: var(--text-primary);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-top-width: 4px;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .card-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-secondary);
            border: 2px dashed var(--border);
            border-radius: 12px;
            margin-top: 2rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: var(--text-tertiary);
            margin-bottom: 1.5rem;
        }

        /* Group Detail */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: var(--accent);
        }

        .group-info {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .group-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .info-item {
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .info-item label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .info-item p {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .channels-chart {
            background: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
        }

        .channel-bar {
            margin-bottom: 1rem;
        }

        .channel-bar label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 0.75rem;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .notes-section {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .notes-section h4 {
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .notes-section p {
            color: var(--text-secondary);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .pda-history-section {
            margin-top: 2rem;
        }

        .pda-history-section h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .pda-history-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 5px solid var(--success);
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .pda-history-card strong {
            display: block;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .pda-history-card p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .pda-history-card .dates {
            font-size: 0.85rem;
            color: var(--text-tertiary);
        }

        /* Students List */
        .students-section {
            margin-top: 2rem;
        }

        .students-section h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .students-table {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .student-row {
            display: grid;
            grid-template-columns: 60px 1fr 150px 100px;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .student-row:last-child {
            border-bottom: none;
        }

        .student-row:hover {
            background: var(--bg-tertiary);
        }

        .student-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        .student-row.header {
            background: var(--bg-tertiary);
            font-weight: 600;
            cursor: default;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
        }

        .tag-input-container input {
            flex-grow: 1;
            border: none;
            outline: none;
            padding: 0.25rem;
            background: transparent;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .tag-badge {
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        [data-theme="dark"] .tag-badge {
            color: var(--text-primary);
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-tertiary);
        }

        .tag-remove:hover {
            color: var(--danger);
        }

        .interest-stat-badge {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .interest-stat-badge .count {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .filter-badge {
            background: var(--bg-primary);
            color: var(--text-secondary);
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            display: inline-block;
            margin: 0.25rem;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .filter-badge:hover {
            border-color: var(--accent);
        }

        .filter-badge.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .autocomplete-suggestions {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-top: none;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1001;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 16px var(--shadow);
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: var(--accent-light);
        }

        .suggestion-item .content {
            font-weight: 600;
            display: block;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .suggestion-item .pda {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            padding: 2rem 2rem 1rem 2rem;
            border-bottom: 2px solid var(--border);
        }

        .modal-header h3 {
            font-size: 1.75rem;
            color: var(--text-primary);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-footer {
            padding: 1rem 2rem 2rem 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            resize: vertical;
            min-height: 100px;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .student-row {
                grid-template-columns: 50px 1fr 120px 80px;
                font-size: 0.9rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .group-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-header">
                <h1>Sistema de Gestión Pedagógica</h1>
                <p>Administra tus grupos y alumnos de manera eficiente</p>
            </div>
            
            <div id="loginError" class="error-message" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="passwordInput">Contraseña</label>
                    <input type="password" id="passwordInput" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
            
            <div style="margin-top: 1rem;">
                <p style="text-align: center; color: var(--text-tertiary); font-size: 0.85rem; margin-bottom: 1rem;">
                    ¿Primera vez aquí?
                </p>
                <button id="setPasswordBtn" class="btn btn-secondary">Establecer Contraseña</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📚 Gestión Pedagógica</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle">🌙</button>
                    <button class="btn btn-small btn-secondary" id="exportDataBtn">Exportar Datos</button>
                    <button class="btn btn-small btn-secondary" id="importDataBtn">Importar Datos</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;">
                    <button class="btn btn-small btn-danger" id="logoutBtn">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- View: Groups List -->
            <div class="view-groups active" id="viewGroups">
                <div class="section-header">
                    <h2>Mis Grupos</h2>
                    <button class="btn btn-primary" id="addGroupBtn">+ Crear Grupo</button>
                </div>
                
                <div id="groupsContainer"></div>
            </div>

            <!-- View: Group Detail -->
            <div class="view-group-detail" id="viewGroupDetail">
                <a href="#" class="back-button" id="backToGroups">← Volver a grupos</a>
                
                <div class="section-header">
                    <h2 id="groupDetailTitle"></h2>
                    <div>
                        <button class="btn btn-small btn-secondary" id="editGroupBtn">Editar</button>
                        <button class="btn btn-small btn-danger" id="deleteGroupBtn">Eliminar</button>
                    </div>
                </div>

                <div class="group-info" id="groupInfoContainer"></div>

                <div class="students-section">
                    <div class="section-header">
                        <h3>Alumnos del Grupo</h3>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-small btn-secondary" id="toggleFilterBtn" style="display: none;">🌪️ Filtros</button>
                            <button class="btn btn-primary btn-small" id="addStudentBtn">+ Agregar Alumno</button>
                        </div>
                    </div>
                    <div id="interestFilterContainer" class="notes-section" style="display: none; margin-bottom: 1rem;"></div>
                    <div id="studentsTableContainer"></div>
                </div>
            </div>

            <!-- View: Student Detail -->
            <div class="view-student-detail" id="viewStudentDetail">
                <a href="#" class="back-button" id="backToGroup">← Volver al grupo</a>
                
                <div class="section-header">
                    <h2 id="studentDetailTitle"></h2>
                    <div>
                        <button class="btn btn-small btn-secondary" id="editStudentBtn">Editar</button>
                        <button class="btn btn-small btn-danger" id="deleteStudentBtn">Eliminar</button>
                    </div>
                </div>

                <div class="group-info" id="studentInfoContainer"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Group Form -->
    <div class="modal" id="groupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">Crear Grupo</h3>
            </div>
            <div class="modal-body">
                <form id="groupForm">
                    <div class="form-row">

        // Data Structure
        let appData = {
            password: '',
            groups: []
        };

        let currentGroupId = null;
        let currentStudentId = null;
        let editingGroupId = null;
        let editingStudentId = null;
        let currentStudentInterests = [];
        let currentStudentFutureCareers = [];
        let activeInterestFilters = [];
        
        // Initialize
        function init() {
            loadData();
            setupEventListeners();
            checkAuth();
        }

        // Local Storage
        function loadData() {
            const saved = localStorage.getItem('pedagogicalData');
            if (saved) {
                appData = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('pedagogicalData', JSON.stringify(appData));
        }

        // Authentication
        function checkAuth() {
            if (!appData.password) {
                showSetPasswordPrompt();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        }

        function showSetPasswordPrompt() {
            const password = prompt('Bienvenido! Por favor, establece una contraseña para proteger tu información:');
            if (password && password.length >= 4) {
                appData.password = password;
                saveData();
                login(password);
            } else {
                alert('La contraseña debe tener al menos 4 caracteres.');
                showSetPasswordPrompt();
            }
        }

        function login(password) {
            if (password === appData.password) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').classList.add('active');
                renderGroups();
            } else {
                showError('Contraseña incorrecta');
            }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('passwordInput').value = '';
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        // Navigation
        function showView(viewName) {
            document.querySelectorAll('.view-groups, .view-group-detail, .view-student-detail').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(viewName).classList.add('active');
        }

        // Groups Management
        function renderGroups() {
            const container = document.getElementById('groupsContainer');
            
            if (appData.groups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tienes grupos registrados</h3>
                        <p>Comienza creando tu primer grupo de alumnos</p>
                        <button class="btn btn-primary" onclick="openGroupModal()">+ Crear Primer Grupo</button>
                    </div>
                `;
                return;
            }

            const cardsHTML = appData.groups.map(group => `
                <div class="card" onclick="showGroupDetail('${group.id}')" style="border-top-color: ${group.color || 'var(--accent)'};">
                    <h3>${group.name}</h3>
                    <div class="card-meta">
                        ${group.grade ? `<span>${group.grade}° Grado</span>` : ''}
                        <span>👥 ${group.students?.length || 0} alumnos</span>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="cards-grid">${cardsHTML}</div>`;
        }

        function showGroupDetail(groupId) {
            currentGroupId = groupId;
            const group = appData.groups.find(g => g.id === groupId);
            
            if (!group) return;

            // Ensure completedPDAs exists for backward compatibility
            if (!group.completedPDAs) {
                group.completedPDAs = [];
            }

            document.getElementById('groupDetailTitle').textContent = group.name;

            const students = group.students || [];
            const totalStudents = students.length;
            const channels = { Visual: 0, Auditivo: 0, Kinestésico: 0 };
            students.forEach(student => {
                if (channels.hasOwnProperty(student.learningChannel)) {
                    channels[student.learningChannel]++;
                }
            });

            const percentages = {
                Visual: totalStudents > 0 ? Math.round((channels.Visual / totalStudents) * 100) : 0,
                Auditivo: totalStudents > 0 ? Math.round((channels.Auditivo / totalStudents) * 100) : 0,
                Kinestésico: totalStudents > 0 ? Math.round((channels.Kinestésico / totalStudents) * 100) : 0
            };

            const groupInfoHTML = `

                        <p>${totalStudents}</p>

                            <p style="margin-top: 0.25rem;">${group.pda || 'No hay un PDA activo.'}</p>
                            <p class="dates" style="margin-top: 0.5rem;">Inicio: ${group.pdaDate || 'N/A'}</p>
                        </div>
                        ${group.pda ? '<button class="btn btn-small btn-success" id="finishPDABtn">✓ Finalizar PDA Actual</button>' : ''}
                    </div>
                </div>

                ${group.notes ? `
                    <div class="notes-section">
                        <h4>Notas del Grupo</h4>
                        <p>${group.notes}</p>

                <div id="interestStatsContainer" class="notes-section" style="margin-top: 1.5rem;"></div>

                existingHistory.remove();
            }

            pdaHistorySection.className = 'pda-history-section';

        function finishCurrentPDA() {
            const group = appData.groups.find(g => g.id === currentGroupId);

                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const endDate = prompt("Confirma la fecha de finalización (AAAA-MM-DD):", today);

            if (endDate === null) {
                return;
            }

            // Ensure completedPDAs exists
            if (!group.completedPDAs) {
                group.completedPDAs = [];
            }

            group.completedPDAs.push({
                content: group.pdaContent,
                pda: group.pda,
                startDate: group.pdaDate,
                endDate: endDate
            });

            group.pda = '';

        function renderInterestFilters(allStudents) {
            const container = document.getElementById('interestFilterContainer');
            const toggleBtn = document.getElementById('toggleFilterBtn');
            const uniqueInterests = [...new Set(allStudents.flatMap(s => s.interests || []))];

            if (uniqueInterests.length === 0) {
                container.style.display = 'none';
                toggleBtn.style.display = 'none';
                return;
            }
            toggleBtn.style.display = 'inline-block';

            let filtersHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <h4 style="margin: 0;">Filtrar por Interés</h4>
                    <button class="btn btn-small btn-secondary" id="clearFiltersBtn">Limpiar</button>
                </div>
                <div>
                    ${uniqueInterests.map(interest => `
                        <span class="filter-badge ${activeInterestFilters.includes(interest) ? 'active' : ''}" data-interest="${interest}">
                            ${interest}
                        </span>
                    `).join('')}
                </div>
            `;
            container.innerHTML = filtersHTML;

            // Event Listeners for filters
            container.querySelectorAll('.filter-badge').forEach(badge => {
                badge.addEventListener('click', () => {
                    const interest = badge.dataset.interest;
                    if (activeInterestFilters.includes(interest)) {
                        activeInterestFilters = activeInterestFilters.filter(i => i !== interest);
                    } else {
                        activeInterestFilters.push(interest);
                    }
                    renderInterestFilters(allStudents); // Re-render filters to show active state
                    
                    const filteredStudents = allStudents.filter(student => 
                        activeInterestFilters.length === 0 || 
                        activeInterestFilters.every(filter => student.interests?.includes(filter))
                    );
                    renderStudentsTable(filteredStudents);
                });
            });

            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                activeInterestFilters = [];
                renderInterestFilters(allStudents);
                renderStudentsTable(allStudents);
            });
        }

        // PDA Management
        function normalizeText(text) {
            if (!text) return '';
            return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function filterPDAsByGradeAndQuery(grade, query) {
            if (!grade || !query) return [];

            const gradeData = PDA_DATA[grade];
            if (!gradeData) return [];

            const normalizedQuery = normalizeText(query);
            const results = [];

            for (const content in gradeData) {
                const normalizedContent = normalizeText(content);
                const pdas = gradeData[content];

                pdas.forEach(pda => {
                    const normalizedPda = normalizeText(pda);
                    if (normalizedContent.includes(normalizedQuery) || normalizedPda.includes(normalizedQuery)) {
                        results.push({ content, pda });
                    }
                });
            }

            return results.slice(0, 8);
        }

        function showPdaSuggestions() {
            const query = document.getElementById('groupPDA').value;
            const grade = document.getElementById('groupGrade').value;
            const suggestionsContainer = document.getElementById('pdaSuggestions');

            if (!grade) {
                suggestionsContainer.innerHTML = '<div class="suggestion-item" style="cursor: not-allowed;">Por favor, selecciona primero el grado del grupo.</div>';
                suggestionsContainer.style.display = 'block';
                return;
            }

            if (query.length < 2) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            const suggestions = filterPDAsByGradeAndQuery(grade, query);
            
            if (suggestions.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            suggestionsContainer.innerHTML = suggestions.map(s => `
                <div class="suggestion-item" data-pda="${s.pda}" data-content="${s.content}">
                    <span class="content">${s.content}</span>
                    <span class="pda">${s.pda}</span>
                </div>
            `).join('');

            suggestionsContainer.style.display = 'block';
        }

        // Export/Import
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `gestion-pedagogica-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById('importFileInput').click();
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    // Validación básica de estructura
                    if (!imported || !Array.isArray(imported.groups)) {
                        throw new Error('Formato de archivo inválido');
                    }
                    if (confirm('¿Estás seguro? Esto reemplazará todos tus datos actuales.')) {
                        appData = imported;
                        saveData();
                        renderGroups();
                        alert('Datos importados correctamente');
                    }
                } catch (error) {
                    alert('Error al importar: El archivo no tiene el formato correcto de respaldo.');
                }
                // Limpiar el input para permitir importar el mismo archivo nuevamente si es necesario
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function updateAutocompleteLists() {
            const interests = new Set();
            const careers = new Set();
            
            appData.groups.forEach(g => {
                g.students.forEach(s => {
                    if (Array.isArray(s.interests)) s.interests.forEach(i => interests.add(i));
                    
                    if (Array.isArray(s.futureCareer)) {
                        s.futureCareer.forEach(c => careers.add(c));
                    } else if (s.futureCareer) {
                        careers.add(s.futureCareer);
                    }
                });
            });

            document.getElementById('availableInterests').innerHTML = Array.from(interests).sort().map(i => `<option value="${i}">`).join('');
            document.getElementById('availableCareers').innerHTML = Array.from(careers).sort().map(c => `<option value="${c}">`).join('');
        }

            document.getElementById('groupModal').addEventListener('click', (e) => {
                if (e.target.id === 'groupModal') closeGroupModal();
            });

            document.getElementById('studentModal').addEventListener('click', (e) => {
                if (e.target.id === 'studentModal') closeStudentModal();
            });

            document.getElementById('interestInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const tagValue = this.value.trim();
                    if (tagValue && !currentStudentInterests.includes(tagValue)) {
                        currentStudentInterests.push(tagValue);
                        this.value = '';
                        renderInterestTags();
                    }
                }
            });

            document.getElementById('careerInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const tagValue = this.value.trim();
                    if (tagValue && !currentStudentFutureCareers.includes(tagValue)) {
                        currentStudentFutureCareers.push(tagValue);
                        this.value = '';
                        renderCareerTags();
                    }
                }
            });
        }

        function renderInterestTags() {
            const container = document.getElementById('interestsTagContainer');
            // Clear existing tags except for the input
            container.querySelectorAll('.tag-badge').forEach(tagEl => tagEl.remove());

            currentStudentInterests.forEach(tag => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag-badge';
                tagEl.innerHTML = `
                    <span>${tag}</span>
                    <span class="tag-remove" data-tag="${tag}">&times;</span>
                `;
                container.insertBefore(tagEl, document.getElementById('interestInput'));
            });

            // Add event listeners to remove buttons
            container.querySelectorAll('.tag-remove').forEach(removeBtn => {
                removeBtn.addEventListener('click', function() {
                    const tagToRemove = this.dataset.tag;
                    currentStudentInterests = currentStudentInterests.filter(t => t !== tagToRemove);
                    renderInterestTags();
                });
            });
        }

        function renderCareerTags() {
            const container = document.getElementById('careersTagContainer');
            container.querySelectorAll('.tag-badge').forEach(tagEl => tagEl.remove());

            currentStudentFutureCareers.forEach(tag => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag-badge';
                tagEl.innerHTML = `
                    <span>${tag}</span>
                    <span class="tag-remove" data-tag="${tag}">&times;</span>
                `;
                container.insertBefore(tagEl, document.getElementById('careerInput'));
            });

            container.querySelectorAll('.tag-remove').forEach(removeBtn => {
                removeBtn.addEventListener('click', function() {
                    const tagToRemove = this.dataset.tag;
                    currentStudentFutureCareers = currentStudentFutureCareers.filter(t => t !== tagToRemove);
                    renderCareerTags();
                });
            });
        }

        // Start app
        init();
    </script>
</body>
</html>
