<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Open Book Base -->
  <g filter="url(#shadow)" transform="translate(48, 64)">
    <!-- Book Cover Base Backing -->
    <path d="M208 340 C140 310 70 320 16 345 L16 115 C70 90 140 80 208 110 Z" fill="url(#accentGrad)"/>
    <path d="M208 340 C276 310 346 320 400 345 L400 115 C346 90 276 80 208 110 Z" fill="url(#accentGrad)"/>
    
    <!-- Spine Center -->
    <path d="M208 110 L208 340" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Book Page -->
    <path d="M200 330 C136 302 72 312 24 334 L24 124 C72 102 136 92 200 120 Z" fill="url(#pageGrad)"/>
    
    <!-- Right Book Page -->
    <path d="M216 330 C280 302 344 312 392 334 L392 124 C344 102 280 92 216 120 Z" fill="url(#pageGrad)"/>

    <!-- Left Page Pedagogical Text Lines -->
    <line x1="50" y1="150" x2="175" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="180" x2="175" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="210" x2="175" y2="210" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="240" x2="145" y2="240" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="270" x2="160" y2="270" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right Page Sociogram / Constellation Network -->
    <!-- Network Links -->
    <line x1="250" y1="230" x2="310" y2="165" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="2,2"/>
    <line x1="310" y1="165" x2="365" y2="215" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="250" y1="230" x2="330" y2="280" stroke="#10b981" stroke-width="3.5"/>
    <line x1="365" y1="215" x2="330" y2="280" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="310" y1="165" x2="330" y2="280" stroke="#8b5cf6" stroke-width="3.5"/>

    <!-- Network Nodes (Students / Connections) -->
    <!-- Center / Leader Node -->
    <circle cx="310" cy="165" r="19" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Peripheral Nodes -->
    <circle cx="250" cy="230" r="14" fill="url(#nodeGrad1)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="365" cy="215" r="15" fill="url(#nodeGrad2)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="330" cy="280" r="13" fill="url(#nodeGrad3)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Golden Graduation / Excellence Star at Top -->
  <polygon points="256,40 266,66 294,67 271,83 280,109 256,92 232,109 241,83 218,67 246,66" fill="#facc15" filter="url(#shadow)"/>
</svg>
